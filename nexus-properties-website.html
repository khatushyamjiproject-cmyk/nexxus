<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus Properties — Jaipur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --blueprint: #16324F;
    --blueprint-deep: #0E2438;
    --parchment: #F3EDE1;
    --parchment-line: #E4DAC8;
    --brass: #C08A2E;
    --brass-bright: #D9A63E;
    --charcoal: #1F2421;
    --sage: #5B7065;
    --line-white: rgba(243,237,225,0.14);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Inter', sans-serif;
    color:var(--charcoal);
    background:var(--parchment);
    line-height:1.5;
  }
  h1,h2,h3{font-family:'Space Grotesk', sans-serif;}
  .mono{font-family:'IBM Plex Mono', monospace;}
  a{color:inherit;}

  /* ---------- NAV ---------- */
  nav{
    position:sticky; top:0; z-index:50;
    background:var(--blueprint);
    border-bottom:1px solid rgba(255,255,255,0.1);
  }
  .nav-inner{
    max-width:1140px; margin:0 auto; padding:18px 24px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .brand{
    color:var(--parchment); font-family:'Space Grotesk', sans-serif;
    font-weight:700; font-size:1.15rem; letter-spacing:0.02em;
    display:flex; align-items:center; gap:10px;
  }
  .brand-mark{
    width:26px; height:26px; border:1.5px solid var(--brass-bright); position:relative; flex-shrink:0;
  }
  .brand-mark::before, .brand-mark::after{
    content:''; position:absolute; background:var(--brass-bright);
  }
  .brand-mark::before{ width:100%; height:1.5px; top:50%; left:0; transform:translateY(-50%); }
  .brand-mark::after{ height:100%; width:1.5px; left:50%; top:0; transform:translateX(-50%); }
  .nav-links{ display:flex; gap:28px; font-size:0.85rem; }
  .nav-links a{
    color:rgba(243,237,225,0.75); text-decoration:none; letter-spacing:0.03em;
    text-transform:uppercase; font-size:0.75rem; font-weight:500;
    transition:color 0.2s;
  }
  .nav-links a:hover{ color:var(--brass-bright); }
  @media (max-width:640px){ .nav-links{ display:none; } }

  /* ---------- HERO ---------- */
  .hero{
    background:
      repeating-linear-gradient(0deg, var(--line-white) 0px, var(--line-white) 1px, transparent 1px, transparent 48px),
      repeating-linear-gradient(90deg, var(--line-white) 0px, var(--line-white) 1px, transparent 1px, transparent 48px),
      linear-gradient(160deg, var(--blueprint) 0%, var(--blueprint-deep) 100%);
    color:var(--parchment);
    padding:110px 24px 90px;
    position:relative;
    overflow:hidden;
  }
  .corner-pin{
    position:absolute; width:14px; height:14px; border:2px solid var(--brass-bright); border-radius:50%;
  }
  .corner-pin::after{ content:''; position:absolute; width:1px; height:22px; background:var(--brass-bright); left:50%; top:100%; transform:translateX(-50%); opacity:0.6; }
  .cp-tl{ top:28px; left:28px; } .cp-tr{ top:28px; right:28px; }
  .hero-inner{ max-width:1140px; margin:0 auto; position:relative; }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace; font-size:0.75rem; letter-spacing:0.14em;
    text-transform:uppercase; color:var(--brass-bright); margin-bottom:22px;
    display:flex; align-items:center; gap:10px;
  }
  .eyebrow::before{ content:''; width:28px; height:1px; background:var(--brass-bright); }
  .hero h1{
    font-size:clamp(2.4rem, 5.6vw, 4.1rem); font-weight:700; line-height:1.06;
    letter-spacing:-0.01em; max-width:820px;
  }
  .hero h1 em{ font-style:normal; color:var(--brass-bright); }
  .hero p.lead{
    margin-top:26px; font-size:1.1rem; max-width:560px; color:rgba(243,237,225,0.78);
    font-weight:400;
  }
  .hero-cta{ margin-top:38px; display:flex; gap:16px; flex-wrap:wrap; }
  .btn{
    display:inline-block; padding:14px 30px; font-size:0.85rem; font-weight:600;
    text-decoration:none; letter-spacing:0.02em; border-radius:2px;
    transition:transform 0.15s ease, background 0.15s ease;
  }
  .btn-primary{ background:var(--brass-bright); color:var(--blueprint-deep); }
  .btn-primary:hover{ background:var(--parchment); transform:translateY(-2px); }
  .btn-ghost{ border:1px solid rgba(243,237,225,0.35); color:var(--parchment); }
  .btn-ghost:hover{ border-color:var(--brass-bright); color:var(--brass-bright); }

  /* survey coordinate strip */
  .coord-strip{
    margin-top:64px; display:flex; gap:0; border-top:1px solid rgba(243,237,225,0.18);
    padding-top:24px; flex-wrap:wrap;
  }
  .coord-item{
    flex:1; min-width:130px; padding-right:24px;
  }
  .coord-item .num{ font-family:'IBM Plex Mono', monospace; font-size:1.5rem; color:var(--brass-bright); font-weight:500; }
  .coord-item .label{ font-size:0.72rem; text-transform:uppercase; letter-spacing:0.08em; color:rgba(243,237,225,0.6); margin-top:4px; }

  /* ---------- SECTION SHELL ---------- */
  section{ padding:88px 24px; }
  .section-inner{ max-width:1140px; margin:0 auto; }
  .section-head{ margin-bottom:52px; max-width:640px; }
  .section-tag{
    font-family:'IBM Plex Mono', monospace; font-size:0.72rem; letter-spacing:0.14em;
    text-transform:uppercase; color:var(--sage); margin-bottom:14px;
  }
  .section-head h2{ font-size:clamp(1.8rem, 3.4vw, 2.5rem); font-weight:600; letter-spacing:-0.01em; }
  .section-head p{ margin-top:14px; color:#4a5049; font-size:1rem; }

  /* ---------- ABOUT / PARCELS ---------- */
  .about{ background:var(--parchment); border-bottom:1px solid var(--parchment-line); }
  .parcel-grid{
    display:grid; grid-template-columns:repeat(3, 1fr); gap:0;
    border:1px solid var(--parchment-line);
  }
  .parcel{
    padding:34px 28px; border-right:1px solid var(--parchment-line); border-bottom:1px solid var(--parchment-line);
    position:relative;
  }
  .parcel:nth-child(3n){ border-right:none; }
  .parcel-id{ font-family:'IBM Plex Mono', monospace; font-size:0.7rem; color:var(--sage); letter-spacing:0.08em; }
  .parcel h3{ font-size:1.15rem; margin-top:12px; font-weight:600; }
  .parcel p{ margin-top:10px; font-size:0.92rem; color:#4a5049; }
  @media (max-width:820px){
    .parcel-grid{ grid-template-columns:1fr 1fr; }
    .parcel:nth-child(3n){ border-right:1px solid var(--parchment-line); }
    .parcel:nth-child(2n){ border-right:none; }
  }
  @media (max-width:560px){
    .parcel-grid{ grid-template-columns:1fr; }
    .parcel{ border-right:none !important; }
  }

  /* ---------- PROJECTS ---------- */
  .projects{ background:#EBE3D2; border-bottom:1px solid var(--parchment-line); }
  .project-list{ display:flex; flex-direction:column; border-top:1px solid var(--parchment-line); }
  .project-row{
    display:grid; grid-template-columns:90px 1fr auto; align-items:center; gap:24px;
    padding:26px 4px; border-bottom:1px solid var(--parchment-line);
  }
  .project-row .pnum{ font-family:'IBM Plex Mono', monospace; color:var(--brass); font-size:0.95rem; }
  .project-row .pname{ font-weight:600; font-size:1.1rem; }
  .project-row .pmeta{ font-size:0.85rem; color:#5a6058; margin-top:4px; font-family:'IBM Plex Mono', monospace; }
  .project-row .pstatus{
    font-size:0.72rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--sage);
    border:1px solid var(--sage); padding:6px 12px; white-space:nowrap;
  }
  @media (max-width:640px){
    .project-row{ grid-template-columns:1fr; gap:8px; }
  }

  /* ---------- WHY / TERMS ---------- */
  .terms{ background:var(--parchment); }
  .terms-grid{ display:grid; grid-template-columns:repeat(4, 1fr); gap:1px; background:var(--parchment-line); border:1px solid var(--parchment-line); }
  .term-card{ background:var(--parchment); padding:30px 24px; }
  .term-card .t-num{ font-family:'IBM Plex Mono', monospace; color:var(--brass); font-size:0.85rem; }
  .term-card h4{ font-size:1.4rem; margin-top:10px; font-family:'Space Grotesk', sans-serif; font-weight:600; }
  .term-card p{ font-size:0.85rem; color:#4a5049; margin-top:8px; }
  @media (max-width:820px){ .terms-grid{ grid-template-columns:1fr 1fr; } }
  @media (max-width:480px){ .terms-grid{ grid-template-columns:1fr; } }

  /* ---------- CONTACT ---------- */
  .contact{
    background:linear-gradient(160deg, var(--blueprint) 0%, var(--blueprint-deep) 100%);
    color:var(--parchment);
    position:relative;
  }
  .contact-grid{ display:grid; grid-template-columns:1fr 1fr; gap:64px; }
  @media (max-width:820px){ .contact-grid{ grid-template-columns:1fr; gap:40px; } }
  .contact h2{ font-size:clamp(1.8rem,3.4vw,2.4rem); font-weight:600; }
  .contact-info{ margin-top:28px; display:flex; flex-direction:column; gap:20px; }
  .contact-info .ci-label{ font-family:'IBM Plex Mono', monospace; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.1em; color:var(--brass-bright); }
  .contact-info .ci-value{ font-size:1.05rem; margin-top:4px; }

  form{ display:flex; flex-direction:column; gap:18px; }
  .field label{ display:block; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.08em; color:rgba(243,237,225,0.65); margin-bottom:8px; }
  .field input, .field select, .field textarea{
    width:100%; background:transparent; border:none; border-bottom:1px solid rgba(243,237,225,0.3);
    color:var(--parchment); font-family:'Inter', sans-serif; font-size:0.95rem; padding:10px 2px;
    outline:none; transition:border-color 0.2s;
  }
  .field input::placeholder, .field textarea::placeholder{ color:rgba(243,237,225,0.35); }
  .field input:focus, .field select:focus, .field textarea:focus{ border-color:var(--brass-bright); }
  .field select option{ color:#1F2421; }
  .field textarea{ resize:vertical; min-height:70px; }
  form .btn{ align-self:flex-start; margin-top:8px; border:none; cursor:pointer; }

  /* ---------- FOOTER ---------- */
  footer{
    background:var(--blueprint-deep); color:rgba(243,237,225,0.55);
    padding:28px 24px; font-size:0.78rem;
    display:flex; justify-content:space-between; flex-wrap:wrap; gap:12px;
  }
  footer .fbrand{ color:rgba(243,237,225,0.8); font-family:'IBM Plex Mono', monospace; }

  :focus-visible{ outline:2px solid var(--brass-bright); outline-offset:2px; }
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <div class="brand"><span class="brand-mark"></span> NEXUS PROPERTIES</div>
    <div class="nav-links">
      <a href="#about">About</a>
      <a href="#projects">Projects</a>
      <a href="#terms">Why Us</a>
      <a href="#contact">Contact</a>
    </div>
  </div>
</nav>




</body>
</html>
